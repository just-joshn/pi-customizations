schema_version: 1

# Each Benny automation is a pi-pstack subscription in a long-running Pi session rooted in the target repository.
automations:
  # The `name` of each subscription (subscribe_timer or subscribe_webhook). A webhook routine's URL slug is the kebab-case form of this name.
  triage_name: "benny-triage"
  reproduce_name: "benny-reproduce"
  # Absolute path of the target repository checkout. The owning Pi session runs here, and prompts read the pack from
  # <target_repository_path>/.pi/automations/benny/.
  target_repository_path: "/path/to/target-repository"

# How runs start for each new top-level report in the source channel.
trigger:
  # timer: subscribe_timer with `cron`. Each fire wakes the owning session, which sweeps the source channel, claims at
  #        most one report, and hands it to a background Task on the automation's model below.
  # webhook: subscribe_webhook. A Slack app or relay you run POSTs each new top-level report to the local routine URL.
  mode: "timer"
  triage_cron: "*/2 * * * *"
  reproduce_cron: "*/5 * * * *"
  # How far back a sweep reads the source channel for reports that the ledger has not claimed.
  sweep_lookback_minutes: 180

# Durable memory. Plain files that every run reads and writes. Never commit them.
memory:
  directory: "~/.pi/agent/pstack/automations/benny/memories"
  # One tab-separated line per claim: automation, channel, root ts, state (claimed | done | skipped), time, note.
  ledger_file: "ledger.tsv"
  # Operating notes from setup and verified lessons from runs. Never copy report text into it.
  notes_file: "MEMORIES.md"

slack:
  source_channel_id: "SOURCE_CHANNEL_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  # Server name from `pi mcp list`. Each action below is an exact Pi MCP tool name, mcp__<server>__<tool>.
  mcp_server: "slack"
  read_action: "mcp__slack__read-tool-placeholder"
  thread_post_action: "mcp__slack__thread-post-tool-placeholder"
  file_download_action: "mcp__slack__file-download-tool-placeholder"
  operations_edit_action: "mcp__slack__edit-tool-placeholder"
  # Use the Slack MCP tools before the optional bot token.
  prefer_mcp_actions: true
  optional_bot_token_env: "BENNY_SLACK_BOT_TOKEN"
  allow_source_root_posts: false
  allow_worker_slack_writes: false

repository:
  url: "https://github.com/example-org/example-repo"
  default_branch: "main"
  pull_request_action: "gh pr create --draft"
  pull_request_url_format: "https://github.com/{owner}/{repo}/pull/{number}"
  draft_only: true

tracker:
  type: "linear"
  adapter_skill_name: "issue-tracker-adapter-placeholder"
  team: "team-placeholder"
  project: "project-placeholder"
  labels:
    bug: "bug-label-placeholder"
    performance: "performance-label-placeholder"
    intake: "intake-label-placeholder"
    needs_repro: "needs-repro-label-placeholder"
  status: "intake-status-placeholder"
  source_link_title: "Slack report"
  require_compensation_action: true

routing:
  map_path: ".pi/benny/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  skill_name: "control-target-app"
  feature_map_path: ".pi/benny/feature-map.md"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "/tmp/benny-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[benny:bug]"
  performance: "[benny:performance]"
  other: "[benny:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

# Pi model specs from `pi --list-models`, such as provider/model:level. In both trigger modes, each fire's Task runs on
# its automation's model: triage for benny-triage, reproduce for benny-reproduce.
models:
  triage: "choose-a-model-from-pi-list-models"
  reproduce: "choose-a-model-from-pi-list-models"
  code: "choose-a-model-from-pi-list-models"
  media_review: "choose-a-model-from-pi-list-models"
