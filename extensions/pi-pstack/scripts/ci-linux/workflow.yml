name: linux-tests
on:
  push:
    branches: ['ci/**']
permissions:
  contents: read
concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    defaults:
      run:
        working-directory: extensions/pi-pstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap python3 tmux git ripgrep jq
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - name: Install the locked dependencies
        # The snapshot carries the workspace bun.lock, so this resolves exactly what the local run installed and fails if the lock is out of date.
        run: bun install --frozen-lockfile --filter '@justjoshn/pi-pstack'
      - name: No new lint diagnostics
        run: |
          # Biome is pinned to the version lint-baseline.json was recorded with; the script refuses any other.
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/biome" @biomejs/biome@2.5.14
          node scripts/lint-baseline.mjs --check --biome "$RUNNER_TEMP/biome/node_modules/.bin/biome"
      - name: Pi for the worker tests
        run: |
          # The worker, container, and Pi-load tests drive a managed Pi install laid out as <agent>/{bin/pi,install/releases/<v>/...}.
          # It lives outside ~/.pi/agent so the standalone-shim test, which compares against the newest Pi installed there, skips.
          agent="$HOME/pi-e2e/agent"
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/@earendil-works/pi-coding-agent/package.json','utf8')).version")
          mkdir -p "$agent/bin" "$agent/install/releases/$version"
          ln -s "$PWD/node_modules/.bin/pi" "$agent/bin/pi"
          ln -s "$PWD/node_modules" "$agent/install/releases/$version/node_modules"
          echo "$version" > "$agent/install/current-version"
          echo "PSTACK_E2E_PI=$agent/bin/pi" >> "$GITHUB_ENV"
          "$agent/bin/pi" --version
      - name: TLC for the statechart tests
        run: |
          # The same jar the statechart skill pins (v1.7.4); the download is refused unless its sha256 matches.
          jar="$HOME/tlc/tla2tools.jar"
          mkdir -p "$HOME/tlc"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"
          echo "JAVA=$JAVA_HOME_17_X64/bin/java" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version
      - name: Whole suite
        timeout-minutes: 28
        run: |
          # Measured: 685 s with no Pi and over 720 s with one, on a runner that gives vitest one worker; the progress reporter shows a new file finishing every minute.
          mkdir -p out
          status=0
          timeout 1560 npx vitest run --reporter=./scripts/ci-linux/progress-reporter.mjs --reporter=dot --reporter=json --outputFile.json=out/linux-all.json > out/all.log 2>&1 || status=$?
          sed 's/\x1b\[[0-9;]*m//g' out/all.log | grep -E "progress|^ +[0-9]+s |FAIL|Test Files|Tests |Duration" | tail -80
          exit $status
      - name: Identify the results
        if: ${{ !cancelled() }}
        run: |
          node -e '
          import("./scripts/parity-lib.mjs").then(({ sourceDigest }) => {
            const fs = require("node:fs");
            const snap = JSON.parse(fs.readFileSync("ci-snapshot.json", "utf8"));
            const identity = { platform: process.platform, commit: snap.commit, sourceDigest: sourceDigest("."), runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`, nodeVersion: process.version, root: process.cwd() };
            for (const name of ["linux-all"]) if (fs.existsSync(`out/${name}.json`)) fs.writeFileSync(`out/${name}.identity.json`, JSON.stringify(identity, null, 2));
          });
          '
          cp ci-snapshot.json out/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-results
          path: extensions/pi-pstack/out/
          retention-days: 14
