# bun lint configuration: https://bun.com/docs/lint and https://bun.com/docs/runtime/bunfig#linter
# Every rule here reports code whose runtime behavior differs from what it appears to do, so each one is an error.
# Bun's defaults stay on. Rules about style, naming, type annotations, unused code, or speed keep their default level.

[lint]
# The bundled skill scripts are vendored Bun tools, linted upstream.
ignorePatterns = ["/extensions/pi-pstack-v2/skills/"]

[lint.rules]
# Control flow and values
"array-callback-return" = "error"
"block-scoped-var" = "error"
"consistent-return" = "error"
"eqeqeq" = ["error", "smart"]
"no-caller" = "error"
"no-case-declarations" = "error"
"no-cond-assign" = "error"
"no-constant-condition" = "error"
"no-constructor-return" = "error"
"no-control-regex" = "error"
"no-delete-var" = "error"
"no-empty" = "error"
"no-empty-character-class" = "error"
"no-ex-assign" = "error"
"no-extend-native" = "error"
"no-global-assign" = "error"
"no-implicit-globals" = "error"
"no-invalid-this" = "error"
"no-iterator" = "error"
"no-loop-func" = "error"
"no-new" = "error"
"no-new-wrappers" = "error"
"no-nonoctal-decimal-escape" = "error"
"no-octal" = "error"
"no-octal-escape" = "error"
"no-prototype-builtins" = "error"
"no-proto" = "error"
"no-redeclare" = "error"
"no-self-assign" = "error"
"no-self-compare" = "error"
"no-sequences" = "error"
"no-setter-return" = "error"
"no-shadow-restricted-names" = "error"
"no-template-curly-in-string" = "error"
"no-unassigned-vars" = "error"
"no-unmodified-loop-condition" = "error"
"no-unreachable" = "error"
"no-unreachable-loop" = "error"
"no-unused-expressions" = "error"
"no-use-before-define" = ["error", { functions = false, classes = false, variables = false, typedefs = false }]
"no-useless-backreference" = "error"
"no-with" = "error"
"radix" = "error"
"require-atomic-updates" = "error"
"require-yield" = "error"

# Errors and promises
"no-promise-executor-return" = "error"
"preserve-caught-error" = "error"
"prefer-promise-reject-errors" = "error"
"promise/always-return" = "error"
"promise/catch-or-return" = "error"
"promise/no-callback-in-promise" = "error"
"promise/no-multiple-resolved" = "error"
"promise/no-new-statics" = "error"
"promise/no-promise-in-callback" = "error"
"promise/no-return-in-finally" = "error"
"promise/valid-params" = "error"
"@typescript-eslint/await-thenable" = "error"
"@typescript-eslint/no-floating-promises" = "error"
"@typescript-eslint/no-misused-promises" = "error"
"@typescript-eslint/only-throw-error" = "error"
"@typescript-eslint/return-await" = "error"
"@typescript-eslint/strict-void-return" = "error"

# Code injection
"no-eval" = "error"
"@typescript-eslint/no-implied-eval" = "error"

# Output the user reads: stray console.log (AGENTS.md allows the other console methods), "[object Object]"
"no-console" = ["error", { allow = ["assert", "debug", "dir", "error", "info", "table", "trace", "warn"] }]
"@typescript-eslint/no-base-to-string" = "error"
"@typescript-eslint/restrict-plus-operands" = "error"
"@typescript-eslint/restrict-template-expressions" = "error"

# Values the type checker cannot vouch for
"@typescript-eslint/ban-ts-comment" = "error"
"@typescript-eslint/no-array-delete" = "error"
"@typescript-eslint/no-confusing-non-null-assertion" = "error"
"@typescript-eslint/no-deprecated" = "error"
"@typescript-eslint/no-duplicate-enum-values" = "error"
"@typescript-eslint/no-for-in-array" = "error"
"@typescript-eslint/no-import-type-side-effects" = "error"
"@typescript-eslint/no-misused-spread" = "error"
"@typescript-eslint/no-non-null-asserted-nullish-coalescing" = "error"
"@typescript-eslint/no-non-null-asserted-optional-chain" = "error"
"@typescript-eslint/no-non-null-assertion" = "error"
"@typescript-eslint/no-unsafe-argument" = "error"
"@typescript-eslint/no-unsafe-assignment" = "error"
"@typescript-eslint/no-unsafe-call" = "error"
"@typescript-eslint/no-unsafe-declaration-merging" = "error"
"@typescript-eslint/no-unsafe-enum-comparison" = "error"
"@typescript-eslint/no-unsafe-member-access" = "error"
"@typescript-eslint/no-unsafe-return" = "error"
"@typescript-eslint/no-unsafe-type-assertion" = "error"
"@typescript-eslint/no-unsafe-unary-minus" = "error"
"@typescript-eslint/require-array-sort-compare" = "error"
"@typescript-eslint/switch-exhaustiveness-check" = "error"
"@typescript-eslint/unbound-method" = "error"

# Imports and the Node.js versions in "engines"
"import/default" = "error"
"import/export" = "error"
"import/named" = "error"
"import/namespace" = "error"
"import/no-absolute-path" = "error"
"import/no-cycle" = "error"
"import/no-extraneous-dependencies" = "error"
"import/no-import-module-exports" = "error"
"import/no-named-as-default" = "error"
"import/no-named-as-default-member" = "error"
"import/no-self-import" = "error"
"import/no-unresolved" = "error"
"n/handle-callback-err" = "error"
"n/no-exports-assign" = "error"
"n/no-new-require" = "error"
"n/no-path-concat" = "error"
"n/no-process-exit" = "error"
"n/no-unsupported-features/es-builtins" = "error"
"n/no-unsupported-features/es-syntax" = "error"
"n/no-unsupported-features/node-builtins" = "error"

# Likely mistakes in expressions and built-in calls
"oxc/approx-constant" = "error"
"oxc/bad-array-method-on-arguments" = "error"
"oxc/bad-bitwise-operator" = "error"
"oxc/bad-char-at-comparison" = "error"
"oxc/bad-comparison-sequence" = "error"
"oxc/bad-match-all-arg" = "error"
"oxc/bad-min-max-func" = "error"
"oxc/bad-object-literal-comparison" = "error"
"oxc/bad-replace-all-arg" = "error"
"oxc/const-comparisons" = "error"
"oxc/double-comparisons" = "error"
"oxc/erasing-op" = "error"
"oxc/misrefactored-assign-op" = "error"
"oxc/missing-throw" = "error"
"oxc/no-this-in-exported-function" = "error"
"oxc/number-arg-out-of-range" = "error"
"oxc/uninvoked-array-callback" = "error"
"unicorn/new-for-builtins" = "error"
"unicorn/no-accessor-recursion" = "error"
"unicorn/no-array-fill-with-reference-type" = "error"
"unicorn/no-array-reverse" = "error"
"unicorn/no-array-sort" = "error"
"unicorn/no-await-in-promise-methods" = "error"
"unicorn/no-confusing-array-with" = "error"
"unicorn/no-instanceof-array" = "error"
"unicorn/no-instanceof-builtins" = "error"
"unicorn/no-invalid-fetch-options" = "error"
"unicorn/no-invalid-remove-event-listener" = "error"
"unicorn/no-negation-in-equality-check" = "error"
"unicorn/no-new-array" = "error"
"unicorn/no-new-buffer" = "error"
"unicorn/no-object-as-default-parameter" = "error"
"unicorn/no-single-promise-in-promise-methods" = "error"
"unicorn/no-thenable" = "error"
"unicorn/no-unnecessary-await" = "error"
"unicorn/prefer-add-event-listener" = "error"
"unicorn/prefer-number-properties" = "error"
"unicorn/require-post-message-target-origin" = "error"

# Processes, paths, and the environment on the user's machine
"bun/no-console-window-flash" = "error"
"bun/no-cwd-dependent-path" = "error"
"bun/no-env-at-module-scope" = "error"
"bun/no-literal-temp-dir" = "error"
"bun/no-negative-repeat-count" = "error"
"bun/no-unhandled-emitter-errors" = "error"
"bun/no-unportable-commands" = "error"

# Tests that pass without checking the behavior they cover
"vitest/expect-expect" = "error"
"vitest/hoisted-apis-on-top" = "error"
"vitest/no-commented-out-tests" = "error"
"vitest/no-conditional-expect" = "error"
"vitest/no-conditional-tests" = "error"
"vitest/no-disabled-tests" = "error"
"vitest/no-focused-tests" = "error"
"vitest/no-standalone-expect" = "error"
"vitest/require-awaited-expect-poll" = "error"
"vitest/valid-describe-callback" = "error"
"vitest/valid-expect" = "error"
"vitest/valid-expect-in-promise" = "error"
