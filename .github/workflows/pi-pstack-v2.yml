name: pi-pstack-v2

on:
  pull_request:
    paths:
      - '.github/workflows/pi-pstack-v2.yml'
      - 'extensions/pi-pstack-v2/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - if: runner.os == 'Linux'
        name: Install tmux and bubblewrap, and allow the unprivileged user namespaces bubblewrap needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: bun install --frozen-lockfile
      - working-directory: extensions/pi-pstack-v2
        run: |
          bun run typecheck
          bun run test
