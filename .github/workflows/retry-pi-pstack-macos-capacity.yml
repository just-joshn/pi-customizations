name: retry-pi-pstack-macos-capacity

# Hosted macOS ARM often queues, then cancels with no steps when GitHub never
# assigns a runner. That leaves the required verify-macos check red even when
# Ubuntu passed. Re-run failed jobs once on attempt 1 for that case only.

on:
  workflow_run:
    workflows:
      - pi-pstack
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry-once:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run when verify-macos never acquired a runner
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.payload.workflow_run.id;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const linux = jobs.find((job) => job.name === 'verify');
            const macos = jobs.find((job) => job.name === 'verify-macos');
            if (linux?.conclusion !== 'success' || macos === undefined) {
              core.info('Skip retry: Linux verify did not succeed, or verify-macos is missing.');
              return;
            }

            const neverStarted =
              (macos.conclusion === 'cancelled' || macos.conclusion === 'failure') &&
              (!Array.isArray(macos.steps) || macos.steps.length === 0);

            let capacityAnnotation = false;
            try {
              const annotations = await github.rest.checks.listAnnotations({
                owner,
                repo,
                check_run_id: macos.id,
              });
              capacityAnnotation = annotations.data.some((annotation) =>
                /not acquired by Runner|capacity constraints/i.test(annotation.message ?? ''),
              );
            } catch (error) {
              core.info(`Annotation lookup skipped: ${error instanceof Error ? error.message : String(error)}`);
            }

            if (!neverStarted && !capacityAnnotation) {
              core.info(`Skip retry: verify-macos conclusion=${macos.conclusion}; not a capacity miss.`);
              return;
            }

            core.info(`Re-running failed jobs for run ${runId} after macOS runner capacity miss.`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner,
              repo,
              run_id: runId,
            });
