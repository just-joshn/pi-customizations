name: retry-pi-pstack-macos-capacity

# Hosted macOS ARM often queues, then cancels with no steps when GitHub never
# assigns a runner. That leaves the required verify-macos check red even when
# Ubuntu passed. Re-run failed jobs once on attempt 1 for that case only.
# Re-running failed jobs also re-runs the verify-macos job that needs them.

on:
  workflow_run:
    workflows:
      - pi-pstack
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry-once:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-run when verify-macos never acquired a runner
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.payload.workflow_run.id;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const linux = jobs.find((job) => job.name === 'verify');
            const macos = jobs.filter((job) => job.name.startsWith('macos ') && job.conclusion !== 'success');
            if (linux?.conclusion !== 'success' || macos.length === 0) {
              core.info('Skip retry: Linux verify did not succeed, or every macOS shard passed.');
              return;
            }

            const capacityMiss = async (job) => {
              if ((job.conclusion === 'cancelled' || job.conclusion === 'failure') && (!Array.isArray(job.steps) || job.steps.length === 0)) {
                return true;
              }
              try {
                const annotations = await github.rest.checks.listAnnotations({ owner, repo, check_run_id: job.id });
                return annotations.data.some((annotation) => /not acquired by Runner|capacity constraints/i.test(annotation.message ?? ''));
              } catch (error) {
                core.info(`Annotation lookup skipped: ${error instanceof Error ? error.message : String(error)}`);
                return false;
              }
            };

            for (const job of macos) {
              if (!(await capacityMiss(job))) {
                core.info(`Skip retry: ${job.name} conclusion=${job.conclusion}; not a capacity miss.`);
                return;
              }
            }

            core.info(`Re-running failed jobs for run ${runId} after macOS runner capacity miss.`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner,
              repo,
              run_id: runId,
            });
