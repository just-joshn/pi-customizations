name: release-checks

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'extensions/pi-rea/**'
      - 'parity/pi-rea/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare native analyzer fixtures
        run: |
          bun -e "import { ensureGoMachoFixtures, ensureMinimalElfCoreFixture } from './parity/pi-rea/scripts/lib/ensure-fixtures.mjs'; ensureGoMachoFixtures(); ensureMinimalElfCoreFixture();"
      - name: Verify package release gates
        run: |
          set -euo pipefail
          for manifest in extensions/*/package.json; do
            if [ "$(jq -r '.private // false' "$manifest")" = true ]; then
              continue
            fi
            dir="${manifest%/package.json}"
            echo "::group::$dir"
            if jq -e '.scripts.typecheck' "$manifest" > /dev/null; then
              (cd "$dir" && bun run typecheck)
            fi
            if jq -e '.scripts.test' "$manifest" > /dev/null; then
              (cd "$dir" && bun run test)
            fi
            echo '::endgroup::'
          done
