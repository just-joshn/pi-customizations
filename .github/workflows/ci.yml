name: ci

# Each pull request runs only the tests its changes reach. The checkout is the pull request's merge commit, whose
# first parent is the base branch, so `HEAD^1` to `HEAD` is the pull request's diff. `plan` lists the packages the
# diff touches, and each package runs `vitest --changed`, which selects new tests and tests whose imports reach a
# changed file. A change to a root file that every package builds on (the lockfile, the root manifest or tsconfig,
# or this workflow) runs every package's full suite.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `bun lint` ships only in canary builds (https://bun.com/docs/lint). Move to a release once it lands in one.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run ci

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: plan
        run: |
          # Workspace packages live at extensions/<name> or extensions/no-ceilings/<name>.
          # Skill-script package.json files deeper in the tree are not workspace packages.
          list_workspace_packages() {
            {
              find extensions -mindepth 2 -maxdepth 2 -name package.json
              find extensions/no-ceilings -mindepth 2 -maxdepth 2 -name package.json 2>/dev/null
            } | sed 's#^extensions/##;s#/package.json$##' | sort -u
          }
          is_workspace_package() {
            case "$1" in
              no-ceilings/*/*) return 1 ;;
              no-ceilings/*) return 0 ;;
              */*) return 1 ;;
              *) return 0 ;;
            esac
          }
          package_for_path() {
            local d rel
            d=$(dirname "$1")
            while [ "$d" = extensions ] || [ "${d#extensions/}" != "$d" ]; do
              if [ -f "$d/package.json" ]; then
                rel=${d#extensions/}
                if is_workspace_package "$rel"; then
                  printf '%s\n' "$rel"
                  return 0
                fi
              fi
              [ "$d" = extensions ] && break
              d=$(dirname "$d")
            done
            return 0
          }
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qxE 'bun\.lock|package\.json|tsconfig\.json|\.github/workflows/ci\.yml' <<< "$changed"; then
            full=true
            packages=$(list_workspace_packages)
          else
            full=false
            packages=$(while IFS= read -r f; do package_for_path "$f"; done <<< "$changed" | sort -u)
          fi
          matrix=$(jq -cnR '[inputs | select(. != "") | {package: ., os: "ubuntu-latest"}]' <<< "$packages")
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Packages: ${packages:-none}. Full suites: $full." >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: test ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/${{ matrix.package }}
    env:
      CHANGED: ${{ needs.plan.outputs.full == 'false' && 'HEAD^1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - if: matrix.package == 'pi-pstack-v2'
        name: Install tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      # Packages without a vitest dependency run their own test script instead.
      - run: |
          if jq -e '.devDependencies.vitest // .dependencies.vitest' package.json > /dev/null; then
            npx vitest run --coverage --passWithNoTests ${CHANGED:+--changed "$CHANGED"}
          else
            bun run test
          fi
      # Vitest cannot see the watch-pr Bun tests, so they run when the scripts they cover changed.
      - if: matrix.package == 'pi-pstack-v2'
        run: |
          if [ -n "$CHANGED" ] && git diff --quiet "$CHANGED" HEAD -- skills/poteto-mode/scripts; then exit 0; fi
          cd skills/poteto-mode/scripts && bun install --frozen-lockfile && bun test watch-pr
