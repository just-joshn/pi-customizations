name: pi-pstack

on:
  pull_request:
    paths:
      - 'extensions/pi-pstack/**'
      - '.github/workflows/pi-pstack.yml'
  push:
    branches:
      - main
    paths:
      - 'extensions/pi-pstack/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/pi-pstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      # The readonly shell's OS sandbox on Linux, per @anthropic-ai/sandbox-runtime's Linux requirements and its
      # Ubuntu 24.04+ note.
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      - run: bun run test
