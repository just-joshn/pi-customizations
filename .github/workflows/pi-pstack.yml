name: pi-pstack

on:
  pull_request:
    paths:
      - 'extensions/pi-pstack/**'
      - '.github/workflows/pi-pstack.yml'
  push:
    branches:
      - main
    paths:
      - 'extensions/pi-pstack/**'

# A new push to a pull request cancels the run it supersedes, which frees the scarce hosted macOS runners.
# Runs on main are never cancelled, so every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Each suite runs in its own job, so the slowest one, not their sum, sets how long a run takes. The required
  # checks `verify` and `verify-macos` below pass only when every shard of their OS passed.
  linux:
    name: linux ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    # A hung test fails its job and leaves a log instead of waiting out GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: vitest 1/2
            vitest: 1/2
          - suite: vitest 2/2
            vitest: 2/2
          # The statechart corpus file holds most of that suite's time, so it is split by test name: the two patterns
          # select complementary sets, and every test runs in exactly one of them.
          - suite: statechart corpus 1/2
            statechart: corpus
            statechart-args: --test-name-pattern=^(Counter|DieHard|FirstRule|HiddenClock|Login)
          - suite: statechart corpus 2/2
            statechart: corpus
            statechart-args: --test-skip-pattern=^(Counter|DieHard|FirstRule|HiddenClock|Login)
          - suite: statechart files 1/2
            statechart: others
            statechart-args: --test-shard=1/2
          - suite: statechart files 2/2
            statechart: others
            statechart-args: --test-shard=2/2
    defaults:
      run:
        working-directory: extensions/pi-pstack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The readonly shell's OS sandbox on Linux, per @anthropic-ai/sandbox-runtime's Linux requirements
      # and its own GitHub Actions integration workflow. Only the Vitest suite starts readonly shells.
      - if: matrix.vitest
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod u+s "$(which bwrap)"
          bwrap --ro-bind / / --unshare-net true
      - run: bun install --frozen-lockfile
        working-directory: .
      - if: matrix.vitest == '1/2'
        run: bun run check:helpers
      - if: matrix.vitest == '1/2'
        run: bun run typecheck
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - run: |
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88' " $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
          echo "JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - if: matrix.vitest
        run: bun run test -- --shard=${{ matrix.vitest }}
      - if: matrix.statechart
        env:
          FILES: ${{ matrix.statechart }}
          ARGS: ${{ matrix.statechart-args }}
        run: |
          if [ "$FILES" = corpus ]; then
            set -- skills/statechart/scripts/test/corpus.test.ts
          else
            set --
            for file in skills/statechart/scripts/test/*.test.ts; do
              [ "$file" = skills/statechart/scripts/test/corpus.test.ts ] || set -- "$@" "$file"
            done
          fi
          node --disable-warning=ExperimentalWarning --test "$ARGS" "$@"

  # The release workflow runs on macOS and publishes from it, so the same suites run here on every pull request.
  # A /var to /private/var temp-root difference and a /proc-only lock takeover both escaped the Ubuntu leg and failed
  # the release instead. Hosted macOS runners are scarce, so this OS gets three shards rather than six.
  #
  # Hosted macOS ARM capacity can cancel a job before any step runs ("not acquired by Runner").
  # retry-pi-pstack-macos-capacity.yml re-runs failed jobs once when that happens and Ubuntu already passed.
  macos:
    name: macos ${{ matrix.suite }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: vitest
            vitest: true
          - suite: statechart corpus
            statechart: corpus
          - suite: statechart files
            statechart: others
    defaults:
      run:
        working-directory: extensions/pi-pstack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: matrix.vitest
        run: brew install ripgrep
      - run: bun install --frozen-lockfile
        working-directory: .
      - if: matrix.vitest
        run: bun run check:helpers
      - if: matrix.vitest
        run: bun run typecheck
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # The macOS index publishes this build as 25.0.5+8.0.LTS, not 25.0.5+8.
          java-version: '25.0.5+8.0.LTS'
      - run: |
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88' " $RUNNER_TEMP/tla2tools.jar" | shasum -a 256 --check
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
          echo "JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - if: matrix.vitest
        run: bun run test
      - if: matrix.statechart
        env:
          FILES: ${{ matrix.statechart }}
        run: |
          if [ "$FILES" = corpus ]; then
            set -- skills/statechart/scripts/test/corpus.test.ts
          else
            set --
            for file in skills/statechart/scripts/test/*.test.ts; do
              [ "$file" = skills/statechart/scripts/test/corpus.test.ts ] || set -- "$@" "$file"
            done
          fi
          node --disable-warning=ExperimentalWarning --test "$@"

  # The required checks. `!cancelled()` lets them report a failed or capacity-cancelled shard instead of skipping,
  # since a skipped job counts as success for a required check.
  verify:
    needs: linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.linux.result }}

  verify-macos:
    needs: macos
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.macos.result }}
