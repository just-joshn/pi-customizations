name: release

# Publishes every extension whose package.json version is not yet on npm.
# Release policy, OIDC trusted publishing, staged publishing, and fallback
# authentication are defined in docs/releases.md (source of truth).

on:
  push:
    branches:
      - main
    paths:
      - 'extensions/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Detect unreleased packages
        id: detect
        run: |
          set -euo pipefail
          unreleased=""
          for manifest in extensions/*/package.json; do
            name=$(jq -r .name "$manifest")
            if [ "$(jq -r '.private // false' "$manifest")" = "true" ]; then
              continue
            fi
            version=$(jq -r .version "$manifest")
            dir="${manifest%/package.json}"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "already published: ${name}@${version}"
            else
              echo "unreleased: ${name}@${version}"
              unreleased="${unreleased}${dir} "
            fi
          done
          echo "packages=${unreleased% }" >> "$GITHUB_OUTPUT"
      - name: Install tmux for the pi-pstack-v2 tests
        if: contains(steps.detect.outputs.packages, 'extensions/pi-pstack-v2')
        run: brew install tmux
      - name: Install workspace dependencies
        if: steps.detect.outputs.packages != ''
        run: bun install --frozen-lockfile
      - name: Verify and publish unreleased packages
        if: steps.detect.outputs.packages != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The runner starts this script with `bash -e`; without `set +e` the
          # first failed package aborts the whole loop (run 41529762501).
          set +e
          set -uo pipefail
          failed=""
          for dir in ${{ steps.detect.outputs.packages }}; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            echo "::group::${name}@${version}"
            (
              set -euo pipefail
              if jq -e '.scripts.typecheck' "$dir/package.json" > /dev/null; then
                (cd "$dir" && bun run typecheck)
              fi
              if jq -e '.scripts.build' "$dir/package.json" > /dev/null; then
                (cd "$dir" && bun run build)
              fi
              if jq -e '.scripts.test' "$dir/package.json" > /dev/null; then
                (cd "$dir" && bun run test)
              fi
              (cd "$dir" && npm pack --dry-run)
              if [ "$HAS_NPM_TOKEN" = "true" ]; then
                (cd "$dir" && NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --access public)
              else
                (cd "$dir" && npm publish)
              fi
              npm view "${name}@${version}" version
              npm dist-tag ls "${name}"
            )
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::release failed for ${name}@${version} (exit ${rc}); inspect the preceding typecheck, build, test, pack, publish, or verification error"
              failed="${failed}${name} "
            else
              echo "- Published [${name}@${version}](https://www.npmjs.com/package/${name})" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed% }" ]; then
            echo "Failed packages: ${failed% }" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Nothing to release
        if: steps.detect.outputs.packages == ''
        run: echo "Every extension version is already published on npm." >> "$GITHUB_STEP_SUMMARY"
