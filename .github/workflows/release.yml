name: release

# Publishes every extension under extensions/*/package.json or
# extensions/no-ceilings/*/package.json whose version is not yet on npm via
# OIDC-only direct `npm publish` on push to `main`. Packages not yet on npm are
# skipped until bootstrapped per docs/releases.md.
# General npm release and publishing policy lives in docs/releases.md.

on:
  push:
    branches:
      - main
    paths:
      - 'extensions/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Detect unreleased packages
        id: detect
        run: |
          set -euo pipefail
          shopt -s nullglob
          unreleased=""
          out_file=$(mktemp)
          err_file=$(mktemp)
          trap 'rm -f "$out_file" "$err_file"' EXIT
          for manifest in extensions/*/package.json extensions/no-ceilings/*/package.json; do
            name=$(jq -r .name "$manifest")
            if [ "$(jq -r '.private // false' "$manifest")" = "true" ]; then
              continue
            fi
            version=$(jq -r .version "$manifest")
            dir="${manifest%/package.json}"
            status=0
            npm view "${name}" versions --json >"$out_file" 2>"$err_file" || status=$?
            if [ "$status" -ne 0 ]; then
              if grep -q 'E404' "$out_file" "$err_file"; then
                echo "::notice::skipping ${name}@${version}: package is not on npm yet; complete initial publish and Trusted Publisher setup per docs/releases.md"
                echo "- Skipped \`${name}@${version}\` (not on npm yet; bootstrap per \`docs/releases.md\`)" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              cat "$err_file" "$out_file" >&2
              echo "::error::npm view failed for ${name} (exit ${status})"
              exit 1
            fi
            jq_rc=0
            jq -e --arg v "$version" '(if type == "array" then . else [.] end) | index($v) != null' <"$out_file" >/dev/null || jq_rc=$?
            if [ "$jq_rc" -eq 0 ]; then
              echo "already published: ${name}@${version}"
            elif [ "$jq_rc" -eq 1 ]; then
              echo "unreleased: ${name}@${version}"
              unreleased="${unreleased}${dir} "
            else
              cat "$out_file" >&2
              echo "::error::failed to parse npm view JSON for ${name} (jq exit ${jq_rc})"
              exit 1
            fi
          done
          echo "packages=${unreleased% }" >> "$GITHUB_OUTPUT"
      - name: Install tmux for the pi-pstack-v2 tests
        if: contains(steps.detect.outputs.packages, 'extensions/pi-pstack-v2')
        run: brew install tmux
      - name: Install workspace dependencies
        if: steps.detect.outputs.packages != ''
        run: bun install --frozen-lockfile
      - name: Verify and publish unreleased packages
        if: steps.detect.outputs.packages != ''
        run: |
          # The runner starts this script with `bash -e`; without `set +e` the
          # first failed package aborts the whole loop (run 41529762501).
          set +e
          set -uo pipefail
          run_if_script() {
            if jq -e --arg s "$1" '.scripts[$s]' package.json >/dev/null; then
              bun run "$1"
            fi
          }
          failed=""
          for dir in ${{ steps.detect.outputs.packages }}; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            echo "::group::${name}@${version}"
            (
              set -euo pipefail
              cd "$dir"
              run_if_script typecheck
              run_if_script build
              run_if_script test
              npm publish
            )
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::release failed for ${name}@${version} (exit ${rc}); inspect the preceding typecheck, build, test, or publish error"
              failed="${failed}${name} "
            else
              echo "- Published [${name}@${version}](https://www.npmjs.com/package/${name})" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed% }" ]; then
            echo "Failed packages: ${failed% }" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Nothing to release
        if: steps.detect.outputs.packages == ''
        run: echo "No eligible extension versions to release." >> "$GITHUB_STEP_SUMMARY"
